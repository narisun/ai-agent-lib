<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 0 · Local sign-in</title>
<style>body{font:16px system-ui;background:#f4f7fa;color:#172b3a;margin:0}main{max-width:480px;margin:8vh auto;background:white;padding:2rem}label{display:block;margin:1rem 0 .4rem}input,select,button{font:inherit;padding:.6rem;box-sizing:border-box;width:100%}button{margin-top:1.2rem;background:#154d66;color:white;border:0}code{overflow-wrap:anywhere}</style>
<main><p>AI AGENT LIBRARY · PHASE 0</p><h1>Try the local agent UI</h1>
<p>This isolated sample uses synthetic data and test identities.</p>
<p>Copy the local access code from <code>.agentlib/access-code.txt</code>.</p>
<form method="post" action="/login"><label for="user">Test identity</label>
<select id="user" name="user"><option value="demo/alice">Alice · demo tenant</option><option value="demo/bob">Bob · demo tenant</option><option value="other/alice">Alice · other tenant</option></select>
<label for="code">Local access code</label><input id="code" name="code" type="password" required autocomplete="off">
<button type="submit">Open chat</button></form></main></html>
