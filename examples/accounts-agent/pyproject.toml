[project]
name = "accounts-agent"
version = "0.1.0"
description = "Reference agent for ai-agent-lib: answers account balance questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-agent-lib-core[jwt,mcp,otel,serve]",
]

[project.scripts]
accounts-agent = "accounts_agent.__main__:main"
accounts-agent-serve = "accounts_agent.service:main"

[tool.uv.sources]
ai-agent-lib-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts_agent"]
