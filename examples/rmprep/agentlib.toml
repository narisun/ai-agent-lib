[[mcp_servers.data.queries]]
name = "activities"
description = "Reviewed activities evidence; dated rows are bounded by the requested dates."
parameters = [{ name = "uen", type = "string", example = "JONE-0022" }, { name = "start_date", type = "date", example = "2025-08-03" }, { name = "end_date", type = "date", example = "2026-08-03" }, { name = "row_offset", type = "integer", example = 0 }]
columns = ["activity_id", "uen", "type", "subject", "activity_date", "owner", "notes"]
masked = []
classification = "confidential"
max_rows = 50
returns_rows = true
definition = "-- description: Reviewed activities evidence; dated rows are bounded by the requested dates.\n-- param uen: string\n-- param start_date: date\n-- param end_date: date\n-- param row_offset: integer\n-- max_rows: 50\n-- classification: confidential\nSELECT t.\"activity_id\" AS \"activity_id\",\n       t.\"uen\" AS \"uen\",\n       t.\"type\" AS \"type\",\n       t.\"subject\" AS \"subject\",\n       t.\"activity_date\" AS \"activity_date\",\n       t.\"owner\" AS \"owner\",\n       t.\"notes\" AS \"notes\"\nFROM \"activities\" t \nWHERE t.uen = :uen AND t.activity_date BETWEEN :start_date AND :end_date\nORDER BY activity_date DESC, activity_id\nOFFSET :row_offset\n"

