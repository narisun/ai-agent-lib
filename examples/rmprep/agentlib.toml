[[mcp_servers.data.queries]]
name = "utilization"
description = "Reviewed utilization evidence; dated rows are bounded by the requested dates."
parameters = [{ name = "uen", type = "string", example = "JONE-0022" }, { name = "start_date", type = "date", example = "2025-08-03" }, { name = "end_date", type = "date", example = "2026-08-03" }, { name = "row_offset", type = "integer", example = 0 }]
columns = ["facility_id", "as_of", "drawn", "available", "utilization_pct", "uen", "amount_currency"]
masked = []
classification = "confidential"
max_rows = 50
returns_rows = true
definition = "-- description: Reviewed utilization evidence; dated rows are bounded by the requested dates.\n-- param uen: string\n-- param start_date: date\n-- param end_date: date\n-- param row_offset: integer\n-- max_rows: 50\n-- classification: confidential\nSELECT t.\"facility_id\" AS \"facility_id\",\n       t.\"as_of\" AS \"as_of\",\n       t.\"drawn\" AS \"drawn\",\n       t.\"available\" AS \"available\",\n       t.\"utilization_pct\" AS \"utilization_pct\",\n       f.uen AS uen,\n       'USD' AS amount_currency\nFROM \"utilization\" t JOIN facilities f ON f.facility_id = t.facility_id\nWHERE f.uen = :uen AND t.as_of BETWEEN :start_date AND :end_date\nORDER BY as_of DESC, facility_id\nOFFSET :row_offset\n"

[[mcp_servers.data.queries]]
name = "working_capital"
description = "Reviewed working capital evidence; dated rows are bounded by the requested dates."
parameters = [{ name = "uen", type = "string", example = "JONE-0022" }, { name = "start_date", type = "date", example = "2025-08-03" }, { name = "end_date", type = "date", example = "2026-08-03" }, { name = "row_offset", type = "integer", example = 0 }]
columns = ["uen", "period_end", "dso_days", "dio_days", "dpo_days", "cash_conversion_cycle_days", "ar_over_90_pct", "inventory_aging_pct", "net_working_capital", "currency", "data_quality"]
masked = []
classification = "confidential"
max_rows = 50
returns_rows = true
definition = "-- description: Reviewed working capital evidence; dated rows are bounded by the requested dates.\n-- param uen: string\n-- param start_date: date\n-- param end_date: date\n-- param row_offset: integer\n-- max_rows: 50\n-- classification: confidential\nSELECT t.\"uen\" AS \"uen\",\n       t.\"period_end\" AS \"period_end\",\n       t.\"dso_days\" AS \"dso_days\",\n       t.\"dio_days\" AS \"dio_days\",\n       t.\"dpo_days\" AS \"dpo_days\",\n       t.\"cash_conversion_cycle_days\" AS \"cash_conversion_cycle_days\",\n       t.\"ar_over_90_pct\" AS \"ar_over_90_pct\",\n       t.\"inventory_aging_pct\" AS \"inventory_aging_pct\",\n       t.\"net_working_capital\" AS \"net_working_capital\",\n       t.\"currency\" AS \"currency\",\n       t.\"data_quality\" AS \"data_quality\"\nFROM \"working_capital\" t \nWHERE t.uen = :uen AND t.period_end BETWEEN :start_date AND :end_date\nORDER BY period_end DESC\nOFFSET :row_offset\n"

[[mcp_servers.data.queries]]
name = "xref"
description = "Reviewed xref evidence; dated rows are bounded by the requested dates."
parameters = [{ name = "search", type = "string", example = "Jones" }, { name = "start_date", type = "date", example = "2025-08-03" }, { name = "end_date", type = "date", example = "2026-08-03" }, { name = "row_offset", type = "integer", example = 0 }]
columns = ["xref_id", "xref_type", "xref_name", "xref_value", "xref_description"]
masked = []
classification = "internal"
max_rows = 50
returns_rows = true
definition = "-- description: Reviewed xref evidence; dated rows are bounded by the requested dates.\n-- param search: string\n-- param start_date: date\n-- param end_date: date\n-- param row_offset: integer\n-- max_rows: 50\n-- classification: internal\nSELECT t.\"xref_id\" AS \"xref_id\",\n       t.\"xref_type\" AS \"xref_type\",\n       t.\"xref_name\" AS \"xref_name\",\n       t.\"xref_value\" AS \"xref_value\",\n       t.\"xref_description\" AS \"xref_description\"\nFROM \"xref\" t \nWHERE STRPOS(LOWER(CAST(t.xref_type AS VARCHAR)), LOWER(:search)) > 0 AND :start_date <= :end_date\nORDER BY \"xref_id\"\nOFFSET :row_offset\n"

