# The rmprep workspace. Every agent and MCP server in it is one member.
# The root is not a package: it only holds what the members share.

[project]
name = "rmprep"
version = "0.1.0"
description = "Agents and MCP servers of commercial-banking, built on agentcraft2-sdk."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["agents/*", "mcp-servers/*"]

# Optional uv support for the local checkout. The pip-based agentcraft2 install
# command uses the library source recorded in agentcraft2.toml instead.
[tool.uv.sources]
agentcraft2-core = { path = "../../packages/agentcraft2-core", editable = true }
agentcraft2-aws = { path = "../../packages/agentcraft2-aws", editable = true }
agentcraft2-cli = { path = "../../packages/agentcraft2-cli", editable = true }

[dependency-groups]
dev = [
    # The agentcraft2 command, to add agents and MCP servers to this workspace.
    "agentcraft2-cli",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=1.4",
    # Tests that reach the network by accident fail instead of passing slowly.
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["agents", "mcp-servers", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
    # No test reaches beyond this machine. Loopback stays open: asyncio needs it
    # on Windows, and a test of a local service such as OPA uses it.
    "--allow-hosts=127.0.0.1,::1",
    "-m", "not integration",
]
markers = [
    "integration: needs something outside the process, such as OPA or a cloud account",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agents/*/src", "mcp-servers/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter keeps lines short where it can; a long string is not an error.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
exclude = ['^\.venv/']
# Resolve namespace test folders and installed services consistently from this workspace.
explicit_package_bases = true
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/agents/rmprep/src",
    "$MYPY_CONFIG_FILE_DIR/mcp-servers/rmprep-data/src",
]
