# The agent registry: which agents exist and which MCP servers each may call.
schema: agentlib.registry/v1
agents:
  - id: accounts-agent
    owner: treasury-data
    # The agent's own (non-human) identity: its application (client) ID at the
    # identity provider. A token names the agent by this ID. Development tokens
    # name it by its registry ID, so local runs need no value here.
    # client_id: 22222222-2222-2222-2222-222222222222
    version: 0.1.0
    description: Answers account balance questions
    mcp_servers: [accounts]
    model_aliases: [default]
    classification_ceiling: restricted
    status: active
