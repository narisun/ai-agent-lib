[project]
name = "accounts-mcp"
version = "0.1.0"
description = "Reference MCP server for ai-agent-lib: governed account queries over CSV files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-agent-lib-core[duckdb,jwt,mcp,otel,serve]",
]

[project.scripts]
accounts-mcp = "accounts_mcp.__main__:main"

[tool.uv.sources]
ai-agent-lib-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts_mcp"]
