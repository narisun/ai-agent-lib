# What the services of this workspace allow. The first rule that matches a
# request allows it; a request that no rule matches is denied.
#
# One document, two engines. In local development the in-process `rules`
# provider reads this file. A deployed service asks OPA, which loads the
# `policies` folder as a bundle (this file becomes `data.agentcraft2.rules`).
#
# This file is yours. agentcraft2 appends the rules a new service needs and never
# changes or removes a rule that is here.
schema: agentcraft2.rules/v1
rules:
  # rmqna-data: who may call its tools. The server runs SQL the model wrote, not a named
  # query, so there is no data.query decision and no per-role column mask or row limit: the
  # controls are the tool-level rule below, the server's SQL validator, its row cap and its
  # timeout (docs/sql-governance.md). The data is synthetic.
  - id: rmqna-data-staff-call-the-tools
    actions: [tool.call]
    applications: [rmqna-data]
    roles: [analyst, manager]
    resources: ["rmqna-data/*"]
    max_classification: confidential

  # rmqna: the models and tools it may use. It has no tools of its own: all it can do is ask
  # rmqna-data. A tool of an MCP server is named <server>/<tool>; the server decides for itself
  # what the caller may see.
  - id: rmqna-uses-its-models
    actions: [model.route]
    applications: [rmqna]
    resources: [default]

  - id: rmqna-calls-rmqna-data
    actions: [tool.call]
    applications: [rmqna]
    resources: ["rmqna-data/*"]
    max_classification: confidential
