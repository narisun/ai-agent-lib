[project]
name = "rmqna"
version = "0.1.0"
description = "Answers relationship-manager questions by writing and running read-only SQL over the client data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcraft2-core[jwt,mcp,otel,serve,anthropic]",
]

[project.scripts]
rmqna = "rmqna.__main__:main"
rmqna-serve = "rmqna.service:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmqna"]
