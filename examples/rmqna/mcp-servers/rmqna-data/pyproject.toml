[project]
name = "rmqna-data"
version = "0.1.0"
description = "A greeting and a people directory, over sample data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-agent-lib-core[duckdb,jwt,mcp,otel,serve]",
]

[project.scripts]
rmqna-data = "rmqna_data.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmqna_data"]
