[project]
name = "rmqna-data"
version = "0.1.0"
description = "Read-only SQL over the relationship-manager data: a contained engine behind three tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcraft2-core[duckdb,jwt,mcp,otel,serve]",
    # The validator reads the statement with sqlglot's syntax tree (exp.Expr, SetOperation) and
    # resolves CTE names with its scope analysis; the library itself allows older versions.
    "sqlglot>=30.0",
    # DuckDB hands a TIMESTAMPTZ (what now() returns) to Python only with pytz installed.
    "pytz",
]

[project.scripts]
rmqna-data = "rmqna_data.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmqna_data"]
