# The library's gate, on Linux and on Windows, at the oldest and the newest
# Python it supports. It runs what a contributor runs before sharing a change.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/install_dev.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: lint-imports
      - run: python -m pytest -q
      - name: The developer guide matches the code
        run: python docs/guide/build_guide.py --check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The version the deployed OPA sidecar runs (templates/deploy-opa/Dockerfile.jinja).
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.0.0"
      # For the deployment module: fmt, validate and its mocked-provider tests.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: python tools/install_dev.py
      - run: python -m pytest -q -m integration

  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, aws, cli, generated-fake, generated-anthropic, generated-bedrock]
        versions: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: matrix.versions == 'minimum'
        run: python tools/check_consumer.py --profile ${{ matrix.profile }} --constraints tools/framework-minimum.txt
      - if: matrix.versions == 'latest'
        run: python tools/check_consumer.py --profile ${{ matrix.profile }}

  container-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/install_dev.py
      - run: python -m pytest packages/ai-agent-lib-cli/tests/unit/test_cli_deploy.py -q -m container
