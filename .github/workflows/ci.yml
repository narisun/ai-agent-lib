# The library's gate, on Linux and on Windows, at the oldest and the newest
# Python it supports. It runs what a contributor runs before sharing a change.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e packages/agentcraft2-core -e "packages/agentcraft2-ui[chat,dev]"
      - run: python -m ruff check .
        working-directory: packages/agentcraft2-ui
      - run: python -m ruff format --check .
        working-directory: packages/agentcraft2-ui
      - run: lint-imports
        working-directory: packages/agentcraft2-ui
      - run: python -m pytest
        working-directory: packages/agentcraft2-ui
      - run: python -m mypy
        working-directory: packages/agentcraft2-ui
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --wheel-dir dist packages/agentcraft2-ui
      - name: Installed UI wheel chat and restart checks
        run: python tools/check_consumer.py --profile ui-chat

  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/install_dev.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: lint-imports
      - run: python -m pytest -q
      - name: Coverage gate on contracts, config, di and pipeline
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        # The specification sets 90; the measured floor on 2026-10-18 was 94.
        run: >
          python -m pytest packages/agentcraft2-core -q
          --cov=agentcraft2_core.contracts --cov=agentcraft2_core.config
          --cov=agentcraft2_core.di --cov=agentcraft2_core.pipeline
          --cov-branch --cov-report=term --cov-fail-under=90
      - name: Relationship manager example policy samples
        run: python -m agentcraft2_cli policy test --workspace examples/rmprep
      - name: Relationship manager data-question example policy samples
        run: python -m agentcraft2_cli policy test --workspace examples/rmqna
      - name: The developer guide matches the code
        run: python docs/guide/build_guide.py --check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The version the deployed OPA sidecar runs (templates/deploy-opa/Dockerfile.jinja).
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.0.0"
      # For the deployment module: fmt, validate and its mocked-provider tests.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: python tools/install_dev.py
      - run: python -m pytest -q -m integration

  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, aws, cli, ui, generated-fake, generated-anthropic, generated-bedrock]
        versions: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: matrix.versions == 'minimum'
        # The anthropic extra needs a newer langchain-core than core's own floor.
        run: >
          python tools/check_consumer.py --profile ${{ matrix.profile }} --constraints
          ${{ matrix.profile == 'generated-anthropic' && 'tools/framework-minimum-anthropic.txt'
          || 'tools/framework-minimum.txt' }}
      - if: matrix.versions == 'latest'
        run: python tools/check_consumer.py --profile ${{ matrix.profile }}

  container-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/install_dev.py
      - run: python -m pytest packages/agentcraft2-cli/tests/unit/test_cli_deploy.py -q -m container
