[project]
name = "agentcraft2-ui"
version = "0.1.0"
description = "Agent Lab: local chat, conversation history and inspection for agentcraft2-sdk agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["agentcraft2-core>=0.1.0,<0.2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
chat = ["chainlit==2.12.0", "httpx>=0.27,<1", "python-dotenv>=1,<2", "filelock>=3.16,<4", "markdown-it-py>=3,<5"]
# SigV4 signing for an agent on AgentCore Runtime; bearer mode needs no extra.
aws = ["boto3>=1.35"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "aiohttp>=3.10", "mypy>=1.11", "ruff>=0.6", "hatchling>=1.25", "import-linter>=2.0", "boto3>=1.35"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcraft2_ui"]

[tool.agentcraft2-sdk]
development-environment = "ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: spawns other processes or depends on the real clock; deselect with -m 'not slow' for a quick loop",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "ARG"]
# Framework overrides retain their public keyword arguments even when disabled.
"src/agentcraft2_ui/integrations/data_layer.py" = ["ARG002"]
"src/agentcraft2_ui/integrations/callbacks.py" = ["ARG001"]
"src/agentcraft2_ui/__main__.py" = ["T201"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
# boto3 ships no inline types; the signer imports it lazily behind a Protocol.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agentcraft2_ui.integrations.callbacks"
# Chainlit's Message.send and user_session.get lack annotations in the pinned release.
disallow_untyped_calls = false

# ------------------------------------------------------------------ import-linter
# The same rules tests/test_boundaries.py checks by parsing, enforced by the
# linter in CI so a violation names the import that broke it.
[tool.importlinter]
root_packages = ["agentcraft2_ui"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "UI contracts import nothing else from the package"
type = "forbidden"
source_modules = ["agentcraft2_ui.contracts"]
forbidden_modules = [
    "agentcraft2_ui.adapters",
    "agentcraft2_ui.application",
    "agentcraft2_ui.config",
    "agentcraft2_ui.integrations",
]

[[tool.importlinter.contracts]]
name = "the UI application layer is framework-free"
type = "forbidden"
source_modules = ["agentcraft2_ui.application"]
forbidden_modules = [
    "agentcraft2_ui.adapters",
    "agentcraft2_ui.integrations",
    "chainlit",
    "fastapi",
    "starlette",
]

[[tool.importlinter.contracts]]
name = "only UI integrations imports the browser framework"
type = "forbidden"
source_modules = [
    "agentcraft2_ui.adapters",
    "agentcraft2_ui.application",
    "agentcraft2_ui.config",
    "agentcraft2_ui.contracts",
]
forbidden_modules = ["chainlit"]
