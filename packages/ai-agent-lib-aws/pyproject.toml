[project]
name = "ai-agent-lib-aws"
version = "0.1.0"
description = "AWS adapters for the Enterprise Agentic Platform library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ai-agent-lib-core",
    "boto3>=1.35",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
# The bedrock model provider.
bedrock = [
    "langchain-aws>=1.0",
]
# The postgres checkpoint store.
postgres = [
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "psycopg-pool>=3.3",
]

[project.entry-points."ai_agent_lib.providers"]
aws = "ai_agent_lib_aws:register"

[tool.uv.sources]
ai-agent-lib-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lib_aws"]
