[project]
name = "ai-agent-lib-ui"
version = "0.1.0"
description = "Agent Lab: local chat, conversation history and inspection for ai-agent-lib agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["ai-agent-lib-core>=0.1.0,<0.2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
chat = ["chainlit==2.12.0", "httpx>=0.27,<1", "python-dotenv>=1,<2", "filelock>=3.16,<4", "markdown-it-py>=3,<5"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "aiohttp>=3.10", "mypy>=1.11", "ruff>=0.6", "hatchling>=1.25"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lib_ui"]

[tool.ai-agent-lib]
development-environment = "ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "ARG"]
# Framework overrides retain their public keyword arguments even when disabled.
"src/ai_agent_lib_ui/integrations/data_layer.py" = ["ARG002"]
"src/ai_agent_lib_ui/integrations/callbacks.py" = ["ARG001"]
"src/ai_agent_lib_ui/__main__.py" = ["T201"]

[[tool.mypy.overrides]]
module = "ai_agent_lib_ui.integrations.callbacks"
# Chainlit's Message.send and user_session.get lack annotations in the pinned release.
disallow_untyped_calls = false
