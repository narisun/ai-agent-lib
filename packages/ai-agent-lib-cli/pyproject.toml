[project]
name = "ai-agent-lib-cli"
version = "0.1.0"
description = "Developer tooling and project templates for the Enterprise Agentic Platform library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # With what a generated MCP server needs to start, so that its tools can be pinned.
    "ai-agent-lib-core[duckdb,mcp]",
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # Formats the code the templates produce, with the settings a workspace uses.
    "ruff>=0.6",
]

[project.scripts]
agentlib = "ai_agent_lib_cli.__main__:main"

[tool.uv.sources]
ai-agent-lib-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lib_cli"]
